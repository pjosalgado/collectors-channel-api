image: python:3.9

stages:
  - test
  - build

include:
  - template: Security/SAST.gitlab-ci.yml

sast:
  stage: test

docker-hub:
  stage: build
  only:
    - master
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    IMAGE_NAME: paulosalgado/collectors-channel-api
  before_script:
    - echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
    - docker buildx create --driver docker-container --use
  script:
    - VERSION=$(sed -n "s/.*version=['\"]\([^'\"]*\)['\"].*/\1/p" setup.py)
    - sed -i "s/\$VERSION/$VERSION/g" Dockerfile
    - |
      docker buildx build \
        --platform=linux/amd64,linux/arm64 \
        --push \
        -t ${IMAGE_NAME}:${VERSION} \
        -t ${IMAGE_NAME}:latest \
        .
